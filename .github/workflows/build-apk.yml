name: Build EvadeDashMapper APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EvadeDashMapper_GitHubActions.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extrair projeto
        run: |
          mkdir buildsrc
          unzip -q EvadeDashMapper_GitHubActions.zip -d buildsrc

      - name: Compilar APK
        working-directory: buildsrc/EvadeDashMapper_GHA
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: EvadeDashMapper-debug-apk
          path: buildsrc/EvadeDashMapper_GHA/app/build/outputs/apk/debug/app-debug.apk
